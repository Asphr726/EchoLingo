[package]
name = "echolingo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "echolingo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { path = "../../../crates/app-core" }
audio-core = { path = "../../../crates/audio-core" }
inference-ipc = { path = "../../../crates/inference-ipc" }
runtime-manager = { path = "../../../crates/runtime-manager" }
transcript-store = { path = "../../../crates/transcript-store" }
chrono.workspace = true
keyring = "4.2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.4"
raw-window-handle = "0.6"
# TLS for the updater's HTTP client: the rustls + aws-lc-rs stack hf-hub and
# the GPU pack already use. The plugin's own `rustls-tls` feature is left
# off because it would compile ring and install it as the process-wide
# rustls provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["system-proxy", "zip"] }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.28"
# Paused time for the assistant event throttle tests.
tokio = { workspace = true, features = ["test-util"] }
