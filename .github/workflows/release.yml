name: Release

on:
  push:
    # Version tags only: the `updater` manifest tag must never start a build.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"
  TORCH_VERSION: "2.13.0"
  TORCHAUDIO_VERSION: "2.11.0"

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            sidecar_mode: onefile
            sidecar: apps/desktop/src-tauri/binaries/echolingo-sidecar-aarch64-apple-darwin
            # Tauri makes the updater archive (.app.tar.gz) only for the `app` bundle type.
            bundles: app,dmg
            updater: true
            artifacts: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/EchoLingo_*_aarch64.app.tar.gz
              target/release/bundle/macos/EchoLingo_*_aarch64.app.tar.gz.sig
          - name: windows-x64
            os: windows-latest
            sidecar_mode: onedir
            sidecar: apps/desktop/src-tauri/sidecar/echolingo-sidecar.exe
            bundles: nsis
            # The updater downloads and runs the signed NSIS setup itself.
            updater: true
            torch_index: https://download.pytorch.org/whl/cpu
            artifacts: |
              target/release/bundle/nsis/*-setup.exe
              target/release/bundle/nsis/*-setup.exe.sig
          - name: linux-x64
            os: ubuntu-22.04
            sidecar_mode: onedir
            sidecar: apps/desktop/src-tauri/sidecar/echolingo-sidecar
            # linuxdeploy fails on the one-folder sidecar; AppImage is on the roadmap.
            bundles: deb
            # The app does not install a .deb itself; it links to the release page.
            # The signed .deb lets latest.json announce the update (linux-x86_64-deb).
            updater: true
            torch_index: https://download.pytorch.org/whl/cpu
            artifacts: |
              target/release/bundle/deb/*.deb
              target/release/bundle/deb/*.deb.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libxdo-dev libssl-dev libdbus-1-dev \
            pkg-config patchelf file libfuse2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - name: Release configuration
        run: |
          python scripts/smoke_packaged.py config
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(python -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
              exit 1
            fi
            if [ ! -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
              echo "::error::.github/release-notes/$GITHUB_REF_NAME.md is missing"
              exit 1
            fi
          fi
      - name: Updater signing key
        if: matrix.updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Relative to apps/desktop, where the npm workspace script runs tauri.
            echo "UPDATER_OVERLAY=src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is empty; a release must ship signed updater artifacts."
            exit 1
          else
            echo "::warning::The TAURI_SIGNING_PRIVATE_KEY secret is empty; building without updater artifacts."
          fi
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Cache llama.cpp archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llama-cache
          key: llama-${{ matrix.name }}-${{ hashFiles('scripts/fetch_llama_runtime.py') }}
      - run: npm ci
      - name: CPU-only torch
        if: matrix.torch_index != ''
        run: >-
          python -m pip install "torch==$TORCH_VERSION" "torchaudio==$TORCHAUDIO_VERSION"
          --index-url "${{ matrix.torch_index }}"
      - name: Python environment
        run: |
          echo "torch==$TORCH_VERSION" > "$RUNNER_TEMP/constraints.txt"
          python -m pip install -e ".[audio,qwen,packaging]" -r requirements/qwen-runtime.txt \
            -c "$RUNNER_TEMP/constraints.txt"
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"
      - name: llama.cpp runtime
        run: python scripts/fetch_llama_runtime.py --cache "$RUNNER_TEMP/llama-cache"
      - name: Sidecar
        run: >-
          python scripts/build_sidecar.py --clean --mode ${{ matrix.sidecar_mode }}
          --work "$RUNNER_TEMP/pyinstaller"
      - name: Smoke test the sidecar and llama.cpp
        run: python scripts/smoke_packaged.py prebundle --sidecar "${{ matrix.sidecar }}"
      - name: Rust supervises the packaged sidecar
        env:
          ECHOLINGO_SIDECAR_EXECUTABLE: ${{ github.workspace }}/${{ matrix.sidecar }}
        run: cargo test -p inference-ipc --locked -- --ignored rust_supervises_python_sidecar_end_to_end
      - name: Tauri bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
          # linuxdeploy's strip breaks the frozen sidecar's libraries.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Read only when the overlay turns on createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: >-
          npm run tauri --workspace @echolingo/desktop -- build --ci --bundles ${{ matrix.bundles }}
          ${UPDATER_OVERLAY:+--config "$UPDATER_OVERLAY"}
      - name: Name the macOS updater archive
        if: runner.os == 'macOS' && env.UPDATER_OVERLAY != ''
        run: |
          version=$(python -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          cd target/release/bundle/macos
          # The signature covers the archive's bytes, not its name.
          mv EchoLingo.app.tar.gz "EchoLingo_${version}_aarch64.app.tar.gz"
          mv EchoLingo.app.tar.gz.sig "EchoLingo_${version}_aarch64.app.tar.gz.sig"
          ls -l
      - name: Smoke test the bundles
        if: runner.os != 'Windows'
        run: python scripts/smoke_packaged.py bundle ${UPDATER_OVERLAY:+--updater}
      - name: Smoke test the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $updater = @(if ($env:UPDATER_OVERLAY) { '--updater' })
          python scripts/smoke_packaged.py bundle --install-dir "$env:RUNNER_TEMP\安装 测试\EchoLingo" @updater
      - uses: actions/upload-artifact@v7
        with:
          name: echolingo-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  gpu-pack:
    name: gpu-pack (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PACK_DIR: ${{ github.workspace }}/../gpu-pack/echolingo-gpu-pack
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: CUDA torch environment
        # CUDA wheels are several GB: no pip cache.
        run: |
          python -m pip install --no-cache-dir "torch==$TORCH_VERSION+cu130" \
            "torchaudio==$TORCHAUDIO_VERSION+cu130" --index-url https://download.pytorch.org/whl/cu130
          echo "torch==$TORCH_VERSION" > "$RUNNER_TEMP/constraints.txt"
          python -m pip install --no-cache-dir -e ".[audio,qwen,packaging]" \
            -r requirements/qwen-runtime.txt zstandard -c "$RUNNER_TEMP/constraints.txt"
          df -h .
      - name: CUDA sidecar
        run: |
          python scripts/build_sidecar.py --clean --mode onedir --out "$PACK_DIR/sidecar" \
            --work "$RUNNER_TEMP/pyinstaller"
          rm -rf "$RUNNER_TEMP/pyinstaller"
      - name: Vulkan llama.cpp runtime
        run: >-
          python scripts/fetch_llama_runtime.py --variant vulkan --dest "$PACK_DIR/llama.cpp"
          --cache "$RUNNER_TEMP/llama-cache"
      - name: GPU pack (self-test --cuda, tar.zst parts, manifest)
        run: |
          python scripts/build_gpu_pack.py --pack-dir "$PACK_DIR" --out dist/gpu-pack
          rm -rf "$PACK_DIR"
          df -h .
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu-pack
      - name: Rust installs the GPU pack from its parts
        env:
          ECHOLINGO_GPU_PACK_TEST_DIR: ${{ github.workspace }}/dist/gpu-pack
        run: cargo test -p runtime-manager --locked -- --ignored gpu_pack_installs_from_local_parts
      - uses: actions/upload-artifact@v7
        with:
          name: echolingo-gpu-pack-${{ matrix.name }}
          path: dist/gpu-pack/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  smoke-models:
    name: smoke-models (${{ matrix.name }})
    needs: [build, gpu-pack]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Smoke client
        run: python -m pip install -e . "huggingface_hub==0.36.2" zstandard
      - uses: actions/download-artifact@v8
        with:
          name: echolingo-${{ matrix.name }}
          path: ${{ runner.temp }}/installer
      - name: Install the NSIS setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\installer\*-setup.exe" | Select-Object -First 1
          python scripts/smoke_packaged.py install-nsis --installer $setup.FullName `
            --install-dir "$env:RUNNER_TEMP\Echo 应用\EchoLingo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "INSTALL_ROOT=$env:RUNNER_TEMP\Echo 应用\EchoLingo" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install the .deb
        if: runner.os == 'Linux'
        run: |
          debs=("$RUNNER_TEMP"/installer/*.deb)
          deb=${debs[0]}
          sudo apt-get update
          sudo apt-get install -y "$deb"
          package=$(dpkg-deb -f "$deb" Package)
          sidecar=$(dpkg -L "$package" | grep '/sidecar/echolingo-sidecar$')
          echo "INSTALL_ROOT=$(dirname "$(dirname "$sidecar")")" >> "$GITHUB_ENV"
      - name: Models on the installed CPU runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python scripts/smoke_models.py --install-root "$env:INSTALL_ROOT"
          --models-dir "$env:RUNNER_TEMP\模型 目录"
          --log-dir "$env:RUNNER_TEMP\smoke-logs\cpu" --label "${{ matrix.name }} installed CPU runtime"
      - name: Models on the installed CPU runtime (Linux)
        if: runner.os == 'Linux'
        run: >-
          python scripts/smoke_models.py --install-root "$INSTALL_ROOT"
          --models-dir "$RUNNER_TEMP/模型 目录"
          --log-dir "$RUNNER_TEMP/smoke-logs/cpu" --label "${{ matrix.name }} installed CPU runtime"
      - uses: actions/download-artifact@v8
        if: needs.gpu-pack.result == 'success'
        with:
          name: echolingo-gpu-pack-${{ matrix.name }}
          path: ${{ runner.temp }}/gpu-pack
      - name: Models on the GPU pack sidecar without a GPU (Windows)
        if: runner.os == 'Windows' && needs.gpu-pack.result == 'success'
        shell: pwsh
        run: |
          $manifest = Get-ChildItem "$env:RUNNER_TEMP\gpu-pack\echolingo-gpu-pack-*.json" | Select-Object -First 1
          python scripts/smoke_models.py --gpu-pack-manifest $manifest.FullName `
            --gpu-pack-dest "$env:RUNNER_TEMP\GPU 加速包" --install-root "$env:INSTALL_ROOT" `
            --models-dir "$env:RUNNER_TEMP\模型 目录" --device cpu `
            --log-dir "$env:RUNNER_TEMP\smoke-logs\gpu-pack" --label "${{ matrix.name }} GPU pack sidecar on CPU"
      - name: Models on the GPU pack sidecar without a GPU (Linux)
        if: runner.os == 'Linux' && needs.gpu-pack.result == 'success'
        run: |
          manifests=("$RUNNER_TEMP"/gpu-pack/echolingo-gpu-pack-*.json)
          python scripts/smoke_models.py --gpu-pack-manifest "${manifests[0]}" \
            --gpu-pack-dest "$RUNNER_TEMP/GPU 加速包" --install-root "$INSTALL_ROOT" \
            --models-dir "$RUNNER_TEMP/模型 目录" --device cpu \
            --log-dir "$RUNNER_TEMP/smoke-logs/gpu-pack" --label "${{ matrix.name }} GPU pack sidecar on CPU"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 7

  release:
    name: draft release
    needs: [build, gpu-pack, smoke-models]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: echolingo-*
          path: artifacts
      - name: Collect the release files
        # One release per version for every platform: the app downloads its GPU
        # pack from releases/download/vX.Y.Z/, next to its own installer.
        run: |
          mkdir -p dist
          for artifact in artifacts/*/; do
            # An artifact keeps the folders below its common root (the DMG and the
            # updater archive come from different bundle folders); releases take files.
            find "$artifact" -type f -exec mv -n -t dist {} +
          done
          if [ -n "$(find artifacts -type f)" ]; then
            echo "::error::duplicate release file names:"
            find artifacts -type f
            exit 1
          fi
          ls -l dist
      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes with checksums
        run: |
          {
            cat ".github/release-notes/$TAG.md"
            printf '\n## SHA-256\n\n```text\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Draft the pre-release
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease
          --title "EchoLingo ${TAG#v} Beta" --notes-file "$RUNNER_TEMP/release-notes.md" dist/*
      - name: Update manifest for review
        # Lists macOS, Windows and Linux from the draft. After the release is published,
        #   python scripts/update_manifest.py --tag vX.Y.Z --publish
        # replaces latest.json on the `updater` release that installed copies read.
        run: |
          python scripts/update_manifest.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" --allow-draft \
            --include-windows --include-linux --out dist/latest.json
          gh release upload "$TAG" dist/latest.json --repo "$GITHUB_REPOSITORY"
